name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install
        run: npm ci --prefix backend && npm ci --prefix frontend
      - name: Prisma validate and generate
        run: npx prisma validate && npx prisma generate
        working-directory: backend
      - name: Typecheck
        run: npm run typecheck --prefix backend && npm run typecheck --prefix frontend
      - name: Unit tests (domain, AI provider, authz)
        run: npm run test:unit --prefix backend
      - name: API tests (supertest + in-memory platform)
        run: npm run test:api --prefix backend
      - name: Next.js component tests
        run: npm test --prefix frontend
      - name: Build API
        run: npm run build --prefix backend
      - name: Build static demo
        run: npm run build --prefix frontend

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t enterprise-erp-ai-api:ci backend
